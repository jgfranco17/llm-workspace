---
services:
  llama-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jgfranco17/llama-dev:latest
    tty: true
    container_name: llama-dev
    runtime: nvidia
    ports:
      - "11434:11434"
    volumes:
      - data:/root/.ollama
    environment:
      # NVIDIA GPU configuration
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

      # Custom model configuration
      - CREATE_CUSTOM_MODEL=${CREATE_CUSTOM_MODEL:-true}
      - CUSTOM_MODEL_NAME=${CUSTOM_MODEL_NAME:-llama-dev}
      - BASE_MODEL=${BASE_MODEL:-llama3}

      # Ollama runtime configuration (optimized for RTX 2060 6GB)
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
